<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f1"><title>MY LOOKBOOK</title><style>
:root{--ink:#242521;--muted:#85847e;--bg:#f7f5f1;--card:#fff;--line:#e7e3dc;--accent:#6b7762}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{position:sticky;top:0;z-index:4;background:#f7f5f1ed;backdrop-filter:blur(14px);padding:22px 20px 12px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.23em;color:var(--accent);font-weight:700}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-size:29px;letter-spacing:-1px;margin:3px 0}.round{border:1px solid var(--line);background:white;border-radius:50%;width:38px;height:38px;font-size:20px}.wrap{max-width:760px;margin:auto;padding:18px 17px 100px}.intro{font-family:Georgia,serif;font-size:22px;margin:5px 0 6px}.sub{font-size:12px;color:var(--muted);line-height:1.7}.stats{display:flex;gap:10px;margin:18px 0}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:13px;flex:1}.num{font:25px Georgia,serif}.tiny{font-size:11px;color:var(--muted)}.tools{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}input,select,textarea{font:inherit;border:1px solid var(--line);background:white;border-radius:10px;padding:11px;width:100%;outline-color:var(--accent)}.search{flex:1;min-width:160px}.filter{width:auto;max-width:48%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--line);background:white;border-radius:15px;overflow:hidden;text-align:left;padding:0;cursor:pointer;color:inherit}.photo{height:190px;background:#ece9e2;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:46px;opacity:.48}.tilebody{padding:11px}.title{font-size:13px;font-weight:650;line-height:1.4}.meta{font-size:11px;color:var(--muted);margin-top:5px}.chip{display:inline-block;border:1px solid var(--line);padding:5px 9px;border-radius:30px;font-size:11px;color:#66675f;margin:3px 3px 0 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffefcf5;border-top:1px solid var(--line);display:flex;justify-content:center;padding:9px 10px max(12px,env(safe-area-inset-bottom));z-index:5}.nav{display:flex;width:min(100%,760px)}.nav button{flex:1;background:none;border:0;color:#999;font-size:11px;padding:4px;display:grid;gap:4px;justify-items:center}.nav .active{color:var(--accent);font-weight:700}.nav b{font-size:20px;font-weight:400}.primary{background:var(--ink);color:white;border:0;border-radius:12px;padding:13px 16px;font-weight:700}.secondary{background:white;border:1px solid var(--line);border-radius:12px;padding:12px}.full{width:100%}.actions{display:flex;gap:8px}.actions>*{flex:1}.empty{text-align:center;padding:55px 20px;color:var(--muted);font-size:13px;line-height:2}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0}.panel h3{font-size:15px;margin:0 0 12px}.field{margin:14px 0}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:7px}.modal{position:fixed;inset:0;background:#0007;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:760px;max-height:93dvh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px 35px}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h2{font:24px Georgia,serif;margin:0}.close{background:none;border:0;font-size:26px}.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:220px;overflow:auto}.check{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:white;padding:9px;border-radius:10px;font-size:12px}.check input{width:auto}.preview{max-height:230px;max-width:100%;object-fit:contain;border-radius:12px;display:block;margin:10px auto}.danger{color:#a34e48}.settings p{font-size:13px;line-height:1.8;color:#65645e}.notice{background:#e8ede4;border-radius:12px;padding:12px;font-size:12px;line-height:1.7}.tagline{font-size:12px;color:var(--muted);margin:10px 0 20px}.badge{position:absolute;bottom:8px;right:8px;background:#fffdf4df;border-radius:20px;padding:5px 9px;font-size:10px}.linkitem{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12px}.mini{width:30px;height:30px;object-fit:cover;border-radius:6px;background:#eee}button{cursor:pointer}button:focus-visible{outline:2px solid var(--accent)}
</style></head><body><header><div class="head"><div><div class="eyebrow">PERSONAL STYLE ARCHIVE</div><div class="brand">MY LOOKBOOK</div></div><button class="round" id="addTop" aria-label="追加">＋</button></div></header><main class="wrap" id="main"></main><div class="bottom"><nav class="nav"><button data-tab="looks"><b>▦</b>LOOKS</button><button data-tab="closet"><b>♧</b>CLOSET</button><button data-tab="settings"><b>⚙</b>SETTINGS</button></nav></div><div id="overlay"></div><script>
const KEY='tsumuri-lookbook-v1';const seed=[['カーキ タックバレルパンツ','UNITED ARROWS / A DAY IN THE LIFE','ボトムス','カーキ'],['ライトピスタチオ ケーブルニット','Ralph Lauren','トップス','ミント'],['赤×紺 ボーダーカーディガン','Ralph Lauren','羽織り','赤'],['キャメル系 チェックロングスカート','','ボトムス','キャメル'],['チャコール ピンストライプジャンプスーツ','','ワンピース・サロペット','チャコール'],['ダークブラウン タックテーパードパンツ','','ボトムス','ブラウン'],['ティファニーブルー NIKE コルテッツ','NIKE','靴','ブルー']];let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!db||!Array.isArray(db.items)||!Array.isArray(db.looks)){db={items:seed.map((s,i)=>({id:'seed'+i,name:s[0],brand:s[1],category:s[2],color:s[3],image:'',notes:''})),looks:[]};save()}let tab='looks',search='',category='すべて';function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('保存容量が不足しています。画像を減らすかバックアップしてください。');return false}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=c=>({'トップス':'👚','ボトムス':'👖','羽織り':'🧥','靴':'👟','バッグ':'👜','アクセサリー':'💍','ワンピース・サロペット':'👗'}[c]||'👗');function photo(o){return o.image?`<img src="${o.image}" alt="">`:`<span class="placeholder">${icon(o.category)}</span>`}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let m=document.getElementById('main');if(tab==='settings'){m.innerHTML=`<h2 class="intro">SETTINGS</h2><p class="tagline">大切なデータの管理</p><div class="panel settings"><h3>データのバックアップ</h3><p>データはこのブラウザ内に保存されます。端末変更・ブラウザデータ削除で消えることがあるため、定期的にバックアップしてください。</p><div class="actions"><button class="primary" onclick="exportData()">書き出す</button><button class="secondary" onclick="document.getElementById('importFile').click()">読み込む</button></div><input hidden type="file" id="importFile" accept="application/json,.json" onchange="importData(this.files[0])"></div><div class="panel settings"><h3>使い方</h3><p>「CLOSET」で服を登録し、「LOOKS」でコーデ画像を追加。コーデに使った服を選択すると、両者を紐づけられます。</p><div class="notice">写真は自動加工・生成しません。選んだ写真を保存用に縮小する場合があります。外部サーバーへの送信はありません。</div></div><div class="panel"><button class="secondary danger full" onclick="resetData()">すべてのデータを初期化</button></div>`;return}let isLook=tab==='looks',list=isLook?db.looks:db.items;let opts=isLook?['すべて','春','夏','秋','冬','通年','オフィス','休日','お出かけ','旅行']:['すべて','トップス','ボトムス','羽織り','ワンピース・サロペット','靴','バッグ','アクセサリー','その他'];m.innerHTML=`<h2 class="intro">${isLook?'Your daily looks.':'Your wardrobe.'}</h2><p class="sub">${isLook?'好きなコーデを集めて、手持ちの服とつなげる。':'お気に入りも定番も、すべてここに。'}</p><div class="stats"><div class="stat"><div class="num">${db.looks.length}</div><div class="tiny">LOOKS</div></div><div class="stat"><div class="num">${db.items.length}</div><div class="tiny">ITEMS</div></div></div><div class="tools"><input class="search" id="search" placeholder="${isLook?'コーデを検索':'アイテムを検索'}" value="${esc(search)}"><select class="filter" id="category">${opts.map(o=>`<option ${o===category?'selected':''}>${o}</option>`).join('')}</select></div><div id="results"></div>`;const searchInput=document.getElementById('search');searchInput.addEventListener('input',e=>{search=e.target.value;if(!e.isComposing)updateResults()});searchInput.addEventListener('compositionend',e=>{search=e.target.value;updateResults()});document.getElementById('category').onchange=e=>{category=e.target.value;updateResults()};updateResults()}
function updateResults(){const isLook=tab==='looks';const list=isLook?db.looks:db.items;const filtered=list.filter(o=>(category==='すべて'||(isLook?(o.season===category||o.scene===category):o.category===category))&&[o.name,o.brand,o.notes,o.color,o.season,o.scene].join(' ').toLowerCase().includes(search.toLowerCase()));const target=document.getElementById('results');if(!target)return;target.innerHTML=`<div class="grid">${filtered.map(o=>`<button class="tile" onclick="openEditor('${isLook?'look':'item'}','${o.id}')"><div class="photo">${photo(o)}${isLook?`<span class="badge">${(o.itemIds||[]).length} items</span>`:''}</div><div class="tilebody"><div class="title">${esc(o.name)}</div><div class="meta">${esc(isLook?[o.season,o.scene].filter(Boolean).join(' · '):[o.brand,o.color].filter(Boolean).join(' · '))}</div></div></button>`).join('')}</div>${!filtered.length?`<div class="empty">${list.length?'条件に合うものがありません':'まだ登録がありません。<br>右上の＋から追加してみてね。'}</div>`:''}`;}

function switchTab(t){tab=t;search='';category='すべて';render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.getElementById('addTop').onclick=()=>{if(tab==='settings')switchTab('looks');openEditor(tab==='closet'?'item':'look')};function openEditor(type,id){let look=type==='look',o=(look?db.looks:db.items).find(x=>x.id===id)||{},overlay=document.getElementById('overlay');overlay.innerHTML=`<div class="modal" onclick="if(event.target===this)closeEditor()"><section class="sheet"><div class="sheethead"><h2>${id?'EDIT':'NEW'} ${look?'LOOK':'ITEM'}</h2><button class="close" onclick="closeEditor()" aria-label="閉じる">×</button></div><form id="editor"><div class="field"><label>${look?'コーデ名':'アイテム名'} *</label><input name="name" required maxlength="100" value="${esc(o.name||'')}" placeholder="${look?'例：秋の休日コーデ':'例：カーキ バレルパンツ'}"></div><div class="field"><label>写真</label><input type="file" id="imageInput" accept="image/*"><div id="preview">${o.image?`<img class="preview" src="${o.image}" alt="登録画像">`:''}</div><label class="linkitem"><input type="checkbox" id="removeImage" style="width:auto">写真を削除</label></div>${look?`<div class="field"><label>季節</label><select name="season">${['','春','夏','秋','冬','通年'].map(v=>`<option ${v===(o.season||'')?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>シーン</label><select name="scene">${['','オフィス','休日','お出かけ','旅行','学校行事','その他'].map(v=>`<option ${v===(o.scene||'')?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>使用アイテム（複数選択可）</label><div class="checkgrid">${db.items.map(it=>`<label class="check"><input type="checkbox" name="itemIds" value="${it.id}" ${(o.itemIds||[]).includes(it.id)?'checked':''}>${esc(it.name)}</label>`).join('')||'<span class="tiny">先にCLOSETで服を登録してください。</span>'}</div></div>`:`<div class="field"><label>カテゴリ</label><select name="category">${['トップス','ボトムス','羽織り','ワンピース・サロペット','靴','バッグ','アクセサリー','その他'].map(v=>`<option ${v===(o.category||'トップス')?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>ブランド</label><input name="brand" value="${esc(o.brand||'')}"></div><div class="field"><label>色</label><input name="color" value="${esc(o.color||'')}"></div>`}<div class="field"><label>メモ</label><textarea name="notes" rows="3" placeholder="着こなしのポイントなど">${esc(o.notes||'')}</textarea></div><div class="actions"><button type="submit" class="primary">保存する</button>${id?'<button type="button" class="secondary danger" id="deleteBtn">削除</button>':''}</div></form></section></div>`;let form=document.getElementById('editor'),imageData=o.image||'';document.getElementById('imageInput').onchange=async e=>{if(!e.target.files[0])return;try{imageData=await compress(e.target.files[0]);document.getElementById('preview').innerHTML=`<img class="preview" src="${imageData}" alt="プレビュー">`}catch(err){alert('画像を読み込めませんでした。別の画像をお試しください。')}};form.onsubmit=e=>{e.preventDefault();let f=new FormData(form),arr=look?db.looks:db.items;let v={...o,id:id||('id'+Date.now()+Math.random().toString(36).slice(2,7)),name:String(f.get('name')).trim(),image:document.getElementById('removeImage').checked?'':imageData,notes:String(f.get('notes')||'')};if(!v.name)return;if(look){v.season=String(f.get('season')||'');v.scene=String(f.get('scene')||'');v.itemIds=f.getAll('itemIds')}else{v.category=String(f.get('category'));v.brand=String(f.get('brand')||'');v.color=String(f.get('color')||'')}if(id){arr[arr.findIndex(x=>x.id===id)]=v}else arr.unshift(v);if(save()){closeEditor();render()}};if(id)document.getElementById('deleteBtn').onclick=()=>{if(!confirm('この登録を削除しますか？'))return;let arr=look?db.looks:db.items;arr.splice(arr.findIndex(x=>x.id===id),1);if(!look)db.looks.forEach(l=>l.itemIds=(l.itemIds||[]).filter(x=>x!==id));save();closeEditor();render()}}
function closeEditor(){document.getElementById('overlay').innerHTML=''}function compress(file){return new Promise((resolve,reject)=>{if(file.size>25*1024*1024)return reject(Error('large'));let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='my-lookbook-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function importData(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.items)||!Array.isArray(data.looks))throw Error();if(!confirm('現在のデータをバックアップファイルで置き換えます。続けますか？'))return;let old=db;db=data;if(!save()){db=old;return}render();alert('読み込みました')}catch{alert('正しいバックアップファイルを選択してください')}}function resetData(){if(!confirm('すべてのコーデ・アイテムを削除します。元には戻せません。続けますか？'))return;db={items:[],looks:[]};save();switchTab('looks')}render();</script></body></html>
